<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Community Event Gallery</h1>

    <table>
        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 1"
                     title="Music Event"
                     class="gallery-img">
                <p>Music Event</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 2"
                     title="Food Festival"
                     class="gallery-img">
                <p>Food Festival</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 3"
                     title="Art Exhibition"
                     class="gallery-img">
                <p>Art Exhibition</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 4"
                     title="Sports Meet"
                     class="gallery-img">
                <p>Sports Meet</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 5"
                     title="Workshop"
                     class="gallery-img">
                <p>Workshop</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Event 6"
                     title="Dance Show"
                     class="gallery-img">
                <p>Dance Show</p>
            </td>
        </tr>
    </table>

</body>
</html>
